<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700">
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/></marker>
<style>
.t{font-family:Arial,'Microsoft JhengHei';fill:#111827}.h{font-size:38px;font-weight:800}.sub{font-size:20px;fill:#475569}
.b{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:24}.g{fill:#ecfdf5;stroke:#16a34a;stroke-width:3;rx:24}
.o{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:24}.r{fill:#fef2f2;stroke:#dc2626;stroke-width:3;rx:24}
.txt{font-size:24px;font-weight:800}.s{font-size:18px;fill:#374151}.ar{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#a)}
.xor{fill:none;stroke:#2563eb;stroke-width:4}.and{fill:none;stroke:#16a34a;stroke-width:4}
</style>
</defs>
<rect width="1400" height="1700" fill="#fff"/>
<text x="700" y="58" text-anchor="middle" class="t h">Half-Adder Layout 製作流程（Laker）</text>
<text x="700" y="94" text-anchor="middle" class="t sub">S = A ⊕ B，Cout = A · B；完成 presim、layout、DRC、LVS、PEX、post-sim</text>

<rect x="85" y="130" width="1230" height="190" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="135" y="175" class="t txt">Half-Adder 邏輯結構示意</text>
<line x1="170" y1="230" x2="310" y2="230" stroke="#111827" stroke-width="4"/><text x="130" y="238" class="t s">A</text>
<line x1="170" y1="280" x2="310" y2="280" stroke="#111827" stroke-width="4"/><text x="130" y="288" class="t s">B</text>
<path d="M330 190 C390 205 430 225 455 255 C430 285 390 305 330 320 C360 285 360 225 330 190" class="xor"/>
<path d="M350 190 C410 205 450 225 475 255 C450 285 410 305 350 320" class="xor"/>
<line x1="475" y1="255" x2="570" y2="255" stroke="#111827" stroke-width="4"/><text x="590" y="263" class="t s">S</text>
<path d="M780 205 L850 205 C920 205 920 305 850 305 L780 305 Z" class="and"/>
<line x1="710" y1="230" x2="780" y2="230" stroke="#111827" stroke-width="4"/><text x="670" y="238" class="t s">A</text>
<line x1="710" y1="280" x2="780" y2="280" stroke="#111827" stroke-width="4"/><text x="670" y="288" class="t s">B</text>
<line x1="920" y1="255" x2="1030" y2="255" stroke="#111827" stroke-width="4"/><text x="1050" y="263" class="t s">Cout</text>

<g transform="translate(320,360)">
<rect width="760" height="78" class="g"/><text x="380" y="48" text-anchor="middle" class="t txt">Start：確認 Half-Adder 邏輯與腳位</text>
<path d="M380 78V125" class="ar"/><rect y="125" width="760" height="86" class="b"/><text x="380" y="160" text-anchor="middle" class="t txt">1 撰寫 / 確認 HA.spi</text><text x="380" y="188" text-anchor="middle" class="t s">.subckt HA A B S Cout vdd gnd；先跑 presim</text>
<path d="M380 211V260" class="ar"/><rect y="260" width="760" height="86" class="b"/><text x="380" y="295" text-anchor="middle" class="t txt">2 建立 HA layout cell</text><text x="380" y="323" text-anchor="middle" class="t s">規劃 A/B 左側輸入，S/Cout 右側輸出，上 VDD 下 GND</text>
<path d="M380 346V395" class="ar"/><rect y="395" width="760" height="86" class="o"/><text x="380" y="430" text-anchor="middle" class="t txt">3 製作 XOR 區塊</text><text x="380" y="458" text-anchor="middle" class="t s">S = A ⊕ B，可用 NAND/INV 組合或依指定 XOR transistor 結構</text>
<path d="M380 481V530" class="ar"/><rect y="530" width="760" height="86" class="o"/><text x="380" y="565" text-anchor="middle" class="t txt">4 製作 AND 區塊</text><text x="380" y="593" text-anchor="middle" class="t s">Cout = A · B，常用 NAND2 + INV 形成 AND</text>
<path d="M380 616V665" class="ar"/><rect y="665" width="760" height="86" class="b"/><text x="380" y="700" text-anchor="middle" class="t txt">5 共用 A/B 輸入與 VDD/GND rail</text><text x="380" y="728" text-anchor="middle" class="t s">A、B 同時送到 XOR 與 AND；避免不必要長線與交錯</text>
<path d="M380 751V800" class="ar"/><rect y="800" width="760" height="86" class="b"/><text x="380" y="835" text-anchor="middle" class="t txt">6 放 CONT / VIA / Metal 完成 routing</text><text x="380" y="863" text-anchor="middle" class="t s">局部用 ME1，跨線用 ME2/ME3；必要時用 ME4</text>
<path d="M380 886V935" class="ar"/><rect y="935" width="760" height="86" class="r"/><text x="380" y="970" text-anchor="middle" class="t txt">7 Pin Text 與驗證</text><text x="380" y="998" text-anchor="middle" class="t s">A B S Cout vdd gnd 名稱一致；DRC → LVS → PEX → Post-sim</text>
<path d="M380 1021V1070" class="ar"/><rect y="1070" width="760" height="78" class="g"/><text x="380" y="1118" text-anchor="middle" class="t txt">完成：波形確認 S 與 Cout 真值表</text>
</g>
</svg>